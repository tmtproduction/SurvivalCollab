<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Survival — Player</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;600&family=Sarabun:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07090d;--sur:#0f141c;--sur2:#151d28;
  --brd:rgba(255,255,255,.07);--brd2:rgba(255,255,255,.13);
  --txt:#d0dce8;--dim:#4a5a6a;
  --amber:#f0a500;--amber-dim:rgba(240,165,0,.1);--amber-brd:rgba(240,165,0,.28);
  --green:#2eb872;--green-dim:rgba(46,184,114,.1);--green-brd:rgba(46,184,114,.28);
  --red:#e03e3e;--red-dim:rgba(224,62,62,.1);--red-brd:rgba(224,62,62,.28);
  --blue-dim:rgba(58,143,212,.1);--blue-brd:rgba(58,143,212,.28);
  --purple:#9b72d0;--purple-dim:rgba(155,114,208,.1);--purple-brd:rgba(155,114,208,.28);
  --orange:#e06b30;
  --mono:'IBM Plex Mono',monospace;--thai:'Sarabun',sans-serif;--deco:'Bebas Neue',sans-serif;
  --r:10px;--rl:14px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg)}
body{color:var(--txt);font-family:var(--thai);overscroll-behavior:none}
#shell{max-width:440px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column}

/* topbar */
#topbar{position:sticky;top:0;z-index:100;background:var(--bg);border-bottom:1px solid var(--brd);padding:10px 18px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.tb-title{font-family:var(--deco);font-size:1.1rem;letter-spacing:.35em;color:var(--amber)}
.conn-dot{width:7px;height:7px;border-radius:50%;background:var(--green);animation:blink 2.4s ease infinite}
.conn-dot.off{background:var(--red);animation:none}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}

/* evbar */
#evbar{height:3px;background:var(--sur2);display:flex;gap:2px;padding:0 2px;flex-shrink:0}
.es{flex:1;border-radius:2px;background:var(--sur2);transition:background .4s}
.es.done{background:var(--green)}.es.cur{background:var(--amber)}
.es.cur-rg{background:var(--purple)}.es.cur-dc{background:var(--orange)}

/* content */
#content{flex:1;padding:14px 16px 96px;display:flex;flex-direction:column;gap:11px}

/* statusbar */
#statusbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:440px;background:var(--sur);border-top:1px solid var(--brd2);padding:9px 16px 14px;display:flex;justify-content:space-around;z-index:100}
.sb-item{display:flex;flex-direction:column;align-items:center;gap:2px}
.sb-val{font-family:var(--deco);font-size:1.25rem;line-height:1}
.sb-lbl{font-family:var(--mono);font-size:.5rem;color:var(--dim);letter-spacing:.1em}
.sb-div{width:1px;background:var(--brd2);align-self:stretch;margin:2px 0}

/* cards */
.card{background:var(--sur);border:1px solid var(--brd);border-radius:var(--rl);padding:14px 16px}
.ca-amber{border-color:var(--amber-brd);background:var(--amber-dim)}
.ca-green{border-color:var(--green-brd);background:var(--green-dim)}
.ca-red{border-color:var(--red-brd);background:var(--red-dim)}
.ca-purple{border-color:var(--purple-brd);background:var(--purple-dim)}
.ca-orange{border-color:rgba(224,107,48,.28);background:rgba(224,107,48,.1)}

/* stepper */
.stepper-wrap{background:var(--sur2);border:1px solid var(--brd2);border-radius:var(--rl);padding:16px 14px}
.step-lbl{font-family:var(--mono);font-size:.58rem;color:var(--dim);text-align:center;margin-bottom:12px;letter-spacing:.1em}
.step-row{display:flex;align-items:center;justify-content:center;gap:20px;margin-bottom:4px}
.step-btn{width:52px;height:52px;border-radius:50%;border:1px solid var(--brd2);background:var(--sur);color:var(--txt);font-size:1.7rem;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.1s;user-select:none;-webkit-user-select:none}
.step-btn:active{background:var(--amber);border-color:var(--amber);color:#000;transform:scale(.91)}
.step-num{font-family:var(--deco);font-size:3.2rem;color:var(--amber);min-width:72px;text-align:center;line-height:1}
.step-max{font-family:var(--mono);font-size:.58rem;color:var(--dim);text-align:center;margin-top:4px}

/* big buttons */
.btn-big{width:100%;padding:15px;border-radius:var(--r);border:none;cursor:pointer;font-family:var(--mono);font-size:.8rem;font-weight:600;letter-spacing:.06em;transition:.12s}
.btn-big:active:not(:disabled){transform:scale(.97)}
.btn-big:disabled{opacity:.32;cursor:not-allowed}
.btn-amber{background:var(--amber);color:#000}
.btn-orange{background:var(--orange);color:#fff}
.btn-ghost{background:transparent;color:var(--dim);border:1px solid var(--brd2)}

/* group items */
.group-item{background:var(--sur);border:1px solid var(--brd);border-radius:var(--r);padding:11px 14px;display:flex;flex-direction:column;gap:5px;cursor:pointer;width:100%;text-align:left;transition:.12s}
.group-item.mine{border-color:var(--amber-brd);background:var(--amber-dim)}
.group-item.full-g{opacity:.35;cursor:not-allowed}
.group-item:active:not(.full-g){background:var(--sur2)}
.g-name{font-family:var(--deco);font-size:1rem;letter-spacing:.12em;color:var(--amber)}
.g-meta{font-family:var(--mono);font-size:.6rem;color:var(--dim)}
.g-tags{display:flex;flex-wrap:wrap;gap:3px}
.g-tag{font-size:.62rem;padding:1px 6px;border-radius:3px;background:var(--sur2);font-family:var(--mono)}
.g-tag-me{background:var(--amber-dim);border:1px solid var(--amber-brd);color:var(--amber)}

/* pool chips */
.pool-row{display:flex;flex-wrap:wrap;gap:5px}
.pchip{font-family:var(--mono);font-size:.62rem;padding:3px 8px;border-radius:5px;background:var(--sur2);border:1px solid var(--brd);display:flex;align-items:center;gap:3px}
.pval{color:var(--amber);font-weight:600}
.pchip.p-ok{background:var(--green-dim);border-color:var(--green-brd)}
.pchip.p-fail{background:var(--red-dim);border-color:var(--red-brd)}

/* req pills */
.req-pills{display:flex;flex-wrap:wrap;gap:4px}
.rpill{font-family:var(--mono);font-size:.62rem;padding:3px 9px;border-radius:20px;display:flex;align-items:center;gap:3px}
.rok{background:var(--green-dim);color:var(--green);border:1px solid var(--green-brd)}
.rfail{background:var(--red-dim);color:var(--red);border:1px solid var(--red-brd)}

/* member rows */
.mrow{display:flex;align-items:center;justify-content:space-between;padding:5px 8px;border-radius:6px;background:var(--sur2);font-size:.78rem}
.mrow+.mrow{margin-top:3px}
.mrow-me{border:1px solid var(--amber-brd);background:var(--amber-dim)}
.mrow-dead{opacity:.22;text-decoration:line-through}
.dbadge{font-family:var(--mono);font-size:.54rem;padding:1px 5px;border-radius:3px;font-weight:600}

/* section header */
.sec-hd{font-family:var(--mono);font-size:.58rem;color:var(--dim);letter-spacing:.15em}

/* log */
.log-toggle{background:none;border:none;width:100%;padding:6px 0;font-family:var(--mono);font-size:.58rem;color:var(--dim);display:flex;align-items:center;justify-content:center;gap:5px;cursor:pointer;letter-spacing:.1em}
.logbox{background:var(--sur2);border:1px solid var(--brd);border-radius:var(--r);padding:10px 12px;max-height:160px;overflow-y:auto;font-family:var(--mono);font-size:.62rem;line-height:2;display:none}
.logbox.open{display:block}
.le{border-bottom:1px solid var(--brd);padding:1px 0}.le:last-child{border:none}
.lg{color:var(--green)}.lb{color:var(--red)}.lw{color:var(--amber)}.li{color:var(--dim)}.lp{color:var(--purple)}

/* done / dead boxes */
.done-box{text-align:center;padding:22px 16px;background:var(--green-dim);border:1px solid var(--green-brd);border-radius:var(--rl)}
.done-title{font-family:var(--deco);font-size:1.2rem;letter-spacing:.1em;color:var(--green)}
.done-sub{font-size:.82rem;color:var(--dim);margin-top:4px;line-height:1.6}
.dead-box{text-align:center;padding:14px;background:var(--red-dim);border:1px solid var(--red-brd);border-radius:var(--rl)}
.dead-title{font-family:var(--deco);font-size:1.1rem;letter-spacing:.1em;color:var(--red)}
.dead-sub{font-size:.78rem;color:var(--dim);margin-top:3px}

/* login */
.login-outer{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px 20px;gap:18px;background:var(--bg)}
.login-logo{font-family:var(--deco);font-size:2.8rem;letter-spacing:.4em;color:var(--amber);text-align:center}
.login-sub{font-family:var(--mono);font-size:.58rem;color:var(--dim);letter-spacing:.22em;text-align:center;margin-top:-12px}
.login-card{width:100%;max-width:360px;background:var(--sur);border:1px solid var(--brd2);border-radius:var(--rl);padding:20px;display:flex;flex-direction:column;gap:13px}
.fld-lbl{font-family:var(--mono);font-size:.58rem;color:var(--dim);letter-spacing:.1em;margin-bottom:4px}
.fld input,.fld select{width:100%;background:var(--sur2);border:1px solid var(--brd2);color:var(--txt);padding:11px 13px;border-radius:var(--r);font-family:var(--thai);font-size:.95rem;outline:none;transition:border-color .15s;-webkit-appearance:none;appearance:none}
.fld input:focus,.fld select:focus{border-color:var(--amber)}
.prev-row{background:var(--sur2);border:1px solid var(--brd);border-radius:var(--r);padding:10px 13px;display:flex;align-items:center;gap:10px;min-height:42px}
.prev-cnt{font-family:var(--deco);font-size:1.5rem;color:var(--amber);line-height:1}
.prev-txt{font-size:.75rem;color:var(--dim)}
.err-msg{font-family:var(--mono);font-size:.65rem;color:var(--red);text-align:center}

/* result */
.result-outer{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px 20px;gap:14px;text-align:center}
.result-icon{font-size:5rem;line-height:1}
.result-title{font-family:var(--deco);font-size:2.6rem;letter-spacing:.12em}
.result-stats{background:var(--sur);border:1px solid var(--brd);border-radius:var(--rl);padding:16px 20px;width:100%;max-width:280px;font-family:var(--mono);font-size:.72rem;color:var(--dim);line-height:2.2}
.result-link{display:inline-block;margin-top:8px;padding:12px 24px;background:var(--amber);color:#000;border-radius:var(--r);font-family:var(--mono);font-weight:600;font-size:.75rem;letter-spacing:.06em;text-decoration:none}

/* animations */
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.fade-up{animation:fadeUp .2s ease}
@keyframes pulseAmber{0%,100%{box-shadow:0 0 0 0 transparent}55%{box-shadow:0 0 0 7px rgba(240,165,0,.12)}}
.pulse-amber{animation:pulseAmber 2.4s ease infinite}
</style>
</head>
<body>
<div id="app"></div>

<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import{getDatabase,ref,set,update,push,onValue,off}from'https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js';

const db=getDatabase(initializeApp({
  apiKey:"AIzaSyDEuYNbzokspK53qc2wZ8t_35e_KLl_8HA",
  authDomain:"survival-collab.firebaseapp.com",
  databaseURL:"https://survival-collab-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId:"survival-collab",storageBucket:"survival-collab.firebasestorage.app",
  messagingSenderId:"232280589644",appId:"1:232280589644:web:5a32f52e5d4c4cf2f5fbe9"
}));

const DEPTS={
  PD1:{item:'เข็มทิศ',icon:'🧭',color:'#4fc3f7'},
  PD2:{item:'ข้อมูล',icon:'📋',color:'#81c784'},
  PD3:{item:'อาหาร',icon:'🍖',color:'#ffd54f'},
  QA:{item:'เงิน',icon:'💰',color:'#f06292'},
  EN:{item:'ยา',icon:'💊',color:'#ce93d8'},
  MN:{item:'เครื่องมือ',icon:'🔧',color:'#ff8a65'}
};
const DK=['PD1','PD2','PD3','QA','EN','MN'];
const GN=['ALPHA','BETA','GAMMA','DELTA','EPSILON','ZETA','ETA','THETA','IOTA','KAPPA','LAMBDA','MU','NU','XI','OMICRON','PI','RHO','SIGMA','TAU','UPSILON'];
const EVENTS=[
  {id:1,name:'หลงทาง',emoji:'🗺',type:'global_per',req:{PD1:5},dmg:2,desc:'แต่ละกลุ่มต้องมีเข็มทิศ 5 ชิ้น'},
  {id:2,name:'หิวโหย',emoji:'🍖',type:'global_per',req:{PD3:5},dmg:3,desc:'แต่ละกลุ่มต้องมีอาหาร 5 ชิ้น'},
  {id:3,name:'บาดเจ็บ',emoji:'🩹',type:'global_per',req:{EN:6},dmg:3,desc:'แต่ละกลุ่มต้องมียา 6 ชิ้น'},
  {id:4,name:'แผ่นดินไหว',emoji:'🌋',type:'regroup',preDmg:0,desc:'กลุ่มกระจัดกระจาย — เลือกกลุ่มใหม่'},
  {id:5,name:'สร้างแพ',emoji:'🛖',type:'people_var',reqMultiplier:{MN:2},dmg:3,desc:'ต้องมีเครื่องมือ = คนมีชีวิต × 2'},
  {id:6,name:'สถานการณ์ฉุกเฉิน',emoji:'⚖',type:'discard',poolCap:35,desc:'แต่ละกลุ่มถือได้ไม่เกิน 35 ชิ้น'},
  {id:7,name:'หนาวจัด',emoji:'🥶',type:'global_per',req:{PD3:1,MN:2},dmg:4,desc:'ต้องมีอาหาร 1 + เครื่องมือ 2 ชิ้น'},
  {id:8,name:'ไฟป่า',emoji:'🔥',type:'regroup',preDmg:2,desc:'ทุกคน -2 HP ก่อน แล้วเลือกกลุ่มใหม่'},
  {id:9,name:'โรคระบาด',emoji:'🦠',type:'global_all',req:{EN:40,QA:20,MN:40},dmgWho:'tiered_shortage',dmgTiers:[{max:0,dmg:0},{max:10,dmg:1},{max:20,dmg:2},{max:999,dmg:3}],desc:'รวม Pool ทั้งหมด'},
  {id:10,name:'หนีรอด',emoji:'🚁',type:'global_all',req:{PD1:30,PD3:30,EN:20,PD2:20,QA:15,MN:15},dmgWho:'tiered_missing_types',dmgTiers:[{max:0,dmg:0},{max:2,dmg:1},{max:4,dmg:2},{max:6,dmg:3}],desc:'รวม Pool สุดท้าย'},
];

// STATE
const S={pid:null,player:null,gs:null,players:{},logs:[],groups:[],connected:false,useAmt:0,discardAmt:0,logOpen:false,err:'',loading:false};

// SESSION
const saveSession=id=>{try{localStorage.setItem('sv3_pid',id)}catch(e){}};
const loadSession=()=>{try{return localStorage.getItem('sv3_pid')}catch(e){return null}};
const clearSession=()=>{try{localStorage.removeItem('sv3_pid')}catch(e){}};

function calcItems(name){
  let t=0;
  for(let i=0;i<name.length;i++){const cp=name.codePointAt(i);if(cp>=0x0E01&&cp<=0x0E2E)t+=2;else if(cp>=0x0E30&&cp<=0x0E4E)t+=1;}
  return Math.max(1,t);
}

function buildGroups(){
  const gs=S.gs||{},gc=gs.groupCount||8,names=gs.groupNames||GN,pa=Object.values(S.players);
  S.groups=Array.from({length:gc},(_,i)=>{
    const members=pa.filter(p=>p.groupId==i),pool={};
    members.filter(p=>p.alive).forEach(p=>{pool[p.dept]=(pool[p.dept]||0)+(p.items||0);});
    return{id:i,name:names[i]||('G'+(i+1)),members,pool,full:members.length>=(gs.maxGroupSize||7),max:gs.maxGroupSize||7};
  });
}

function myGroup(){const p=S.player;if(!p||p.groupId<0)return null;return S.groups.find(g=>g.id==p.groupId)||null;}

function getReq(ev,members){
  if(!ev)return{};
  if(ev.req)return ev.req;
  if(ev.reqMultiplier){
    const cnt=(members||[]).filter(m=>S.players[m.id]?.alive).length,r={};
    Object.entries(ev.reqMultiplier).forEach(([d,m])=>{r[d]=cnt*m;});
    return r;
  }
  return{};
}

// phase logic
function getPhase(){
  const gs=S.gs||{};
  if(!S.pid)return'login';
  const phase=gs.phase||'lobby';
  if(phase==='result')return'result';
  if(phase==='regrouping')return'regroup';
  if(phase==='lobby')return'lobby';
  if(gs.pendingConfirm){
    const ev=EVENTS[(gs.currentEvent||0)];
    if(ev?.type==='regroup')return'wait';
    if(ev?.type==='discard')return'discard';
    return'action';
  }
  return'wait';
}

// FIREBASE
function startListeners(){
  off(ref(db,'game'));off(ref(db,'players'));
  onValue(ref(db,'game'),snap=>{
    const d=snap.val()||{};
    S.gs=d.state||null;
    S.logs=d.logs?Object.values(d.logs).sort((a,b)=>(a.ts||0)-(b.ts||0)).slice(-40):[];
    if(!S.gs?.pendingConfirm){S.useAmt=0;S.discardAmt=0;}
    buildGroups();render();
  });
  onValue(ref(db,'players'),snap=>{
    S.players=snap.val()||{};
    if(S.pid&&S.players[S.pid])S.player=S.players[S.pid];
    buildGroups();render();
  });
  onValue(ref(db,'.info/connected'),snap=>{
    S.connected=snap.val();
    document.querySelectorAll('.conn-dot').forEach(d=>{d.className='conn-dot'+(S.connected?'':' off');});
  });
}

// ACTIONS
async function doLogin(){
  const name=(document.getElementById('inp-name')?.value||'').trim();
  const dept=document.getElementById('inp-dept')?.value||'PD1';
  const row=(document.getElementById('inp-row')?.value||'').trim();
  if(!name){S.err='กรุณากรอกชื่อ';render();return;}
  const gs=S.gs||{};
  if(gs.gameStarted&&gs.phase!=='lobby'){S.err='เกมเริ่มแล้ว ไม่สามารถเข้าร่วมได้';render();return;}
  S.loading=true;S.err='';render();
  const uid=dept+'_'+name+(row?'_'+row:'');
  if(S.players[uid]){S.pid=uid;S.player=S.players[uid];saveSession(uid);S.loading=false;render();return;}
  const items=calcItems(name),hp=gs.defaultHp||8;
  const player={id:uid,name,dept,row:row||'',items,maxItems:items,hp,maxHp:hp,alive:true,groupId:-1};
  await set(ref(db,'players/'+uid),player);
  await push(ref(db,'game/logs'),{ts:Date.now(),type:'i',msg:name+' ('+dept+') เข้าร่วม — '+items+' items'});
  S.pid=uid;S.player=player;saveSession(uid);S.loading=false;render();
}

function doLogout(){
  off(ref(db,'game'));off(ref(db,'players'));
  clearSession();S.pid=null;S.player=null;S.connected=false;render();startListeners();
}

async function doJoinGroup(gid){
  if(!S.pid)return;
  const g=S.groups.find(x=>x.id==gid);
  if(g?.full&&g.id!==S.player?.groupId)return;
  await update(ref(db,'players/'+S.pid),{groupId:gid});
  const gname=(S.gs?.groupNames||GN)[gid]||('G'+gid);
  await push(ref(db,'game/logs'),{ts:Date.now(),type:'i',msg:S.player.name+' เข้าร่วมกลุ่ม '+gname});
}

async function doUseItems(){
  if(S.useAmt<=0||!S.player)return;
  const btn=document.getElementById('btn-use');
  if(btn){btn.disabled=true;btn.textContent='⏳ กำลังส่ง...';}
  const ni=Math.max(0,(S.player.items||0)-S.useAmt);
  await update(ref(db,'players/'+S.pid),{items:ni});
  await push(ref(db,'game/logs'),{ts:Date.now(),type:'g',msg:S.player.name+' ใช้ '+S.useAmt+' '+(DEPTS[S.player.dept]?.icon||'')+' เหลือ '+ni});
  S.useAmt=0;
}

async function doDiscardItems(){
  if(S.discardAmt<=0||!S.player)return;
  if(!confirm('ทิ้ง '+S.discardAmt+' ชิ้นถาวร?'))return;
  const btn=document.getElementById('btn-disc');
  if(btn){btn.disabled=true;btn.textContent='⏳ กำลังส่ง...';}
  const ni=Math.max(0,(S.player.items||0)-S.discardAmt);
  await update(ref(db,'players/'+S.pid),{items:ni});
  await push(ref(db,'game/logs'),{ts:Date.now(),type:'w',msg:S.player.name+' ทิ้ง '+S.discardAmt+' ชิ้น'});
  S.discardAmt=0;
}

function stepUse(d){
  S.useAmt=Math.max(0,Math.min(S.player?.items||0,S.useAmt+d));
  const el=document.getElementById('use-num');if(el)el.textContent=S.useAmt;
  const btn=document.getElementById('btn-use');
  if(btn){btn.disabled=S.useAmt<=0;btn.textContent=S.useAmt>0?'ยืนยันใช้ '+S.useAmt+' ชิ้น':'เลือกจำนวนก่อน';}
}

function stepDiscard(d){
  S.discardAmt=Math.max(0,Math.min(S.player?.items||0,S.discardAmt+d));
  const el=document.getElementById('disc-num');if(el)el.textContent=S.discardAmt;
  const btn=document.getElementById('btn-disc');
  if(btn){btn.disabled=S.discardAmt<=0;btn.textContent=S.discardAmt>0?'ทิ้ง '+S.discardAmt+' ชิ้น':'เลือกจำนวนก่อน';}
}

function toggleLog(){
  S.logOpen=!S.logOpen;
  const lb=document.getElementById('logbox'),btn=document.getElementById('log-toggle');
  if(lb)lb.className='logbox'+(S.logOpen?' open':'');
  if(btn)btn.textContent=S.logOpen?'▲ ซ่อน log':'▼ event log ('+S.logs.length+')';
}

function updatePreview(){
  const name=document.getElementById('inp-name')?.value||'';
  const dept=document.getElementById('inp-dept')?.value||'PD1';
  const d=DEPTS[dept]||DEPTS.PD1;
  const el=document.getElementById('prev-row');if(!el)return;
  const cnt=name?calcItems(name):'-';
  el.innerHTML=`<span style="font-size:1.3rem">${d.icon}</span><span class="prev-cnt">${cnt}</span><span class="prev-txt">${name?'"'+name+'"':'กรอกชื่อเพื่อดู items'}</span>`;
}

// ── RENDER ─────────────────────────────────────────────────
function render(){
  const app=document.getElementById('app');if(!app)return;
  const phase=getPhase();
  if(phase==='login'){renderLogin(app);return;}
  if(phase==='result'){renderResult(app);return;}
  renderShell(app,phase);
}

function renderLogin(app){
  const opts=Object.entries(DEPTS).map(([k,v])=>`<option value="${k}">${v.icon} ${k} — ${v.item}</option>`).join('');
  app.innerHTML=`<div class="login-outer">
    <div class="login-logo">SURVIVAL</div>
    <div class="login-sub">TEAM BUILDING · TMT</div>
    <div class="login-card">
      <div class="fld"><div class="fld-lbl">ชื่อ (ภาษาไทย)</div>
        <input id="inp-name" type="text" placeholder="กรอกชื่อจริง" oninput="updatePreview()" autocomplete="off"></div>
      <div class="fld"><div class="fld-lbl">แผนก</div>
        <select id="inp-dept" onchange="updatePreview()">${opts}</select></div>
      <div class="fld"><div class="fld-lbl">แถวที่ (ไม่บังคับ)</div>
        <input id="inp-row" type="text" placeholder="A, B, 1, 2 ..."></div>
      <div class="prev-row" id="prev-row"><span class="prev-txt">กรอกชื่อเพื่อดู items</span></div>
      ${S.err?`<div class="err-msg">${S.err}</div>`:''}
      <button class="btn-big btn-amber" onclick="doLogin()" ${S.loading?'disabled':''}>${S.loading?'⏳ กำลังโหลด...':'เข้าร่วมเกม →'}</button>
    </div>
  </div>`;
}

function renderResult(app){
  const p=S.player||{},d=DEPTS[p.dept]||{};
  app.innerHTML=`<div class="result-outer">
    <div class="result-icon">${p.alive?'🏆':'💀'}</div>
    <div class="result-title" style="color:${p.alive?'var(--amber)':'var(--red)'}">${p.alive?'รอดแล้ว!':'ไม่รอด'}</div>
    <div class="result-stats">
      <div>ชื่อ: ${p.name}</div><div>แผนก: ${p.dept} ${d.icon||''}</div>
      <div>HP สุดท้าย: ${p.hp||0}/${p.maxHp||0}</div><div>Items เหลือ: ${p.items||0}</div>
    </div>
    <a class="result-link" href="Scoreboard.html">🏆 ดูผลการแข่งขัน</a>
  </div>`;
}

function renderShell(app,phase){
  const p=S.player||{},gs=S.gs||{},evIdx=gs.currentEvent||0;
  const hc=p.hp<=2?'var(--red)':p.hp<=4?'#ff9800':'var(--green)';
  const alive=Object.values(S.players).filter(x=>x.alive).length;
  const types=['','global_per','global_per','global_per','regroup','people_var','discard','global_per','regroup','global_all','global_all'];
  const dots=Array.from({length:10},(_,i)=>{
    const t=types[i+1]||'';let c='es';
    if(i<evIdx)c+=' done';
    else if(i===evIdx)c+=(t==='regroup'?' cur-rg':t==='discard'?' cur-dc':' cur');
    return`<div class="${c}"></div>`;
  }).join('');
  const logHtml=S.logs.length?[...S.logs].reverse().slice(0,30).map(l=>`<div class="le l${l.type||'i'}">&gt; ${l.msg}</div>`).join(''):`<div class="le li">// รอเหตุการณ์แรก...</div>`;

  app.innerHTML=`<div id="shell">
    <div id="topbar">
      <div class="tb-title">SURVIVAL</div>
      <div style="display:flex;align-items:center;gap:10px">
        <span style="font-family:var(--mono);font-size:.58rem;color:var(--dim)">event ${Math.min(evIdx+1,10)}/10</span>
        <div class="conn-dot${S.connected?'':' off'}"></div>
      </div>
    </div>
    <div id="evbar">${dots}</div>
    <div id="content" class="fade-up">
      ${renderContent(phase)}
      <button class="log-toggle" id="log-toggle" onclick="toggleLog()">▼ event log (${S.logs.length})</button>
      <div class="logbox" id="logbox">${logHtml}</div>
    </div>
    <div id="statusbar">
      <div class="sb-item">
        <div class="sb-val" style="color:${hc}">${p.hp||0}<span style="font-size:.75rem;color:var(--dim)">/${p.maxHp||0}</span></div>
        <div class="sb-lbl">HP</div>
      </div>
      <div class="sb-div"></div>
      <div class="sb-item"><div class="sb-val">${p.items||0}</div><div class="sb-lbl">ITEMS</div></div>
      <div class="sb-div"></div>
      <div class="sb-item"><div class="sb-val">${alive}</div><div class="sb-lbl">ALIVE</div></div>
      <div class="sb-div"></div>
      <div class="sb-item">
        <button onclick="doLogout()" style="background:none;border:none;cursor:pointer;color:var(--dim);font-family:var(--mono);font-size:.56rem;padding:2px 0;line-height:1.6">↩<br>ออก</button>
      </div>
    </div>
  </div>`;
}

function renderContent(phase){
  const p=S.player||{},gs=S.gs||{},evIdx=gs.currentEvent||0,ev=EVENTS[evIdx],d=DEPTS[p.dept]||{},mg=myGroup();
  // dead but game still going
  if(!p.alive&&phase!=='lobby'&&phase!=='regroup'){
    return`<div class="dead-box"><div class="dead-title">💀 คุณถูกตัดออกแล้ว</div><div class="dead-sub">ดูเกมต่อได้ในฐานะผู้ชม</div></div>${evCard(ev,evIdx,mg)}${groupInfo(mg,ev)}`;
  }
  if(phase==='lobby')  return renderLobby(mg);
  if(phase==='regroup')return renderRegroup(mg);
  if(phase==='wait')   return renderWait(ev,evIdx,mg);
  if(phase==='action') return renderAction(ev,evIdx,mg,p,d);
  if(phase==='discard')return renderDiscard(ev,evIdx,mg,p,d);
  return renderWait(ev,evIdx,mg);
}

function renderLobby(mg){
  const p=S.player||{};
  const list=S.groups.map(g=>{
    const mine=g.id===p.groupId;
    const tags=g.members.map(m=>{const md=DEPTS[m.dept]||{},me=m.id===S.pid;return`<span class="g-tag${me?' g-tag-me':''}">${md.icon} ${m.name}${me?' ★':''}</span>`;}).join('');
    return`<button class="group-item${mine?' mine':g.full&&!mine?' full-g':''}" onclick="${g.full&&!mine?'':('doJoinGroup('+g.id+')')}" ${g.full&&!mine?'disabled':''}>
      <div style="display:flex;justify-content:space-between;align-items:center">
        <span class="g-name">${mine?'★ ':''} ${g.name}</span>
        <span class="g-meta${g.full?' ':''}${g.full?'" style="color:var(--red)':''}">${g.members.length}/${g.max}${g.full?' FULL':''}</span>
      </div>
      <div class="g-tags">${tags||'<span style="font-size:.62rem;color:var(--dim)">ว่าง</span>'}</div>
    </button>`;
  }).join('');
  return`
  <div class="card ${mg?'ca-green':'ca-amber'}">
    <div style="text-align:center">
      <div style="font-family:var(--deco);font-size:1.2rem;letter-spacing:.1em;color:${mg?'var(--green)':'var(--amber)'};margin-bottom:3px">
        ${mg?'✓ อยู่กลุ่ม '+mg.name+' แล้ว':'เลือกกลุ่มก่อนเริ่มเกม'}
      </div>
      <div style="font-size:.82rem;color:var(--dim)">${mg?'รอ Admin กด Start Game':'แตะกลุ่มด้านล่าง'}</div>
    </div>
  </div>
  <div class="sec-hd">กลุ่มทั้งหมด</div>
  <div style="display:flex;flex-direction:column;gap:7px">${list}</div>`;
}

function renderRegroup(mg){
  const p=S.player||{};
  const list=S.groups.map(g=>{
    const mine=g.id===p.groupId;
    return`<button class="group-item${mine?' mine':g.full&&!mine?' full-g':''}" onclick="${g.full&&!mine?'':('doJoinGroup('+g.id+')')}" ${g.full&&!mine?'disabled':''}>
      <div style="display:flex;justify-content:space-between;align-items:center">
        <span class="g-name">${mine?'★ ':''} ${g.name}</span>
        <span class="g-meta">${g.members.length}/${g.max}${g.full?' <span style="color:var(--red)">FULL</span>':''}</span>
      </div>
    </button>`;
  }).join('');
  return`
  <div class="card ca-purple">
    <div style="text-align:center">
      <div style="font-size:1.6rem;margin-bottom:5px">🔀</div>
      <div style="font-family:var(--deco);font-size:1.2rem;letter-spacing:.1em;color:var(--purple);margin-bottom:3px">${mg?'อยู่กลุ่ม '+mg.name+' แล้ว':'เลือกกลุ่มใหม่'}</div>
      <div style="font-size:.82rem;color:var(--dim)">${mg?'รอ Admin ยืนยัน Regroup':'กลุ่มถูกรีเซ็ต — เลือกกลุ่มใหม่'}</div>
    </div>
  </div>
  <div class="sec-hd">เลือกกลุ่ม</div>
  <div style="display:flex;flex-direction:column;gap:7px">${list}</div>`;
}

function renderWait(ev,evIdx,mg){
  return`
  <div class="card">
    <div style="text-align:center;padding:14px 0 8px">
      <div style="font-size:2rem;margin-bottom:7px">⏳</div>
      <div style="font-family:var(--deco);font-size:1.5rem;letter-spacing:.08em;color:var(--dim);margin-bottom:4px">รออยู่...</div>
      <div style="font-size:.85rem;color:var(--dim)">รอ Admin เปิด Event ${Math.min(evIdx+1,10)}<br>ยังไม่ต้องทำอะไร</div>
    </div>
  </div>
  ${evCard(ev,evIdx,mg)}${groupInfo(mg,ev)}`;
}

function renderAction(ev,evIdx,mg,p,d){
  if(!(p.items>0)){
    return`<div class="done-box"><div style="font-size:1.8rem;margin-bottom:6px">✅</div>
      <div class="done-title">ส่ง Items แล้ว</div>
      <div class="done-sub">รอผู้อื่นในกลุ่ม<br>แล้ว Admin จะ Confirm</div>
    </div>${evCard(ev,evIdx,mg)}${groupInfo(mg,ev)}`;
  }
  return`
  ${evCard(ev,evIdx,mg)}
  <div class="stepper-wrap pulse-amber">
    <div class="step-lbl">ใช้กี่ชิ้น? &nbsp;(มี ${p.items} ชิ้น)</div>
    <div class="step-row">
      <button class="step-btn" onclick="stepUse(-1)">−</button>
      <div class="step-num" id="use-num">${S.useAmt}</div>
      <button class="step-btn" onclick="stepUse(1)">+</button>
    </div>
    <div class="step-max">${d.icon} ${d.item}</div>
  </div>
  <button id="btn-use" class="btn-big btn-amber" onclick="doUseItems()" ${S.useAmt<=0?'disabled':''}>
    ${S.useAmt>0?'ยืนยันใช้ '+S.useAmt+' ชิ้น':'เลือกจำนวนก่อน'}
  </button>
  ${groupInfo(mg,ev)}`;
}

function renderDiscard(ev,evIdx,mg,p,d){
  const pool=mg?.pool||{},total=DK.reduce((s,dk)=>s+(pool[dk]||0),0),cap=ev?.poolCap||35,over=Math.max(0,total-cap);
  return`
  <div class="card ca-orange">
    <div style="font-family:var(--mono);font-size:.58rem;color:var(--dim);margin-bottom:5px">EVENT ${evIdx+1} · ${ev?.emoji||''} ${ev?.name||''}</div>
    <div style="font-family:var(--deco);font-size:1.1rem;letter-spacing:.06em;color:var(--orange);margin-bottom:3px">กลุ่มถือได้ไม่เกิน ${cap} ชิ้น</div>
    <div style="font-size:.82rem">กลุ่มรวม <b style="color:${over>0?'var(--red)':'var(--green)'}">${total}</b> ชิ้น
      ${over>0?`<span style="color:var(--red)"> — เกิน ${over} ชิ้น!</span>`:'<span style="color:var(--green)"> ✓</span>'}
    </div>
  </div>
  <div class="stepper-wrap">
    <div class="step-lbl">ทิ้งกี่ชิ้น? &nbsp;(มี ${p.items||0} ชิ้น)</div>
    <div class="step-row">
      <button class="step-btn" onclick="stepDiscard(-1)">−</button>
      <div class="step-num" id="disc-num">${S.discardAmt}</div>
      <button class="step-btn" onclick="stepDiscard(1)">+</button>
    </div>
    <div class="step-max">${d.icon} ${d.item}</div>
  </div>
  <button id="btn-disc" class="btn-big btn-orange" onclick="doDiscardItems()" ${S.discardAmt<=0?'disabled':''}>
    ${S.discardAmt>0?'ทิ้ง '+S.discardAmt+' ชิ้น':'เลือกจำนวนก่อน'}
  </button>
  ${groupInfo(mg,ev)}`;
}

// shared components
function evCard(ev,evIdx,mg){
  if(!ev)return'';
  const pool=mg?.pool||{},req=getReq(ev,mg?.members);
  const hasReq=Object.keys(req).length>0&&ev.type!=='discard';
  const pills=hasReq?Object.entries(req).map(([dk,need])=>{
    const have=pool[dk]||0,ok=have>=need;
    return`<span class="rpill ${ok?'rok':'rfail'}">${DEPTS[dk]?.icon||dk} ${have}/${need} ${ok?'✓':'✗'}</span>`;
  }).join(''):'';
  return`<div class="card ca-amber">
    <div style="font-family:var(--mono);font-size:.58rem;color:var(--dim);margin-bottom:5px">EVENT ${evIdx+1} / 10</div>
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:5px">
      <span style="font-size:1.7rem;line-height:1">${ev.emoji}</span>
      <span style="font-family:var(--deco);font-size:1.35rem;letter-spacing:.06em;color:var(--amber)">${ev.name}</span>
    </div>
    <div style="font-size:.83rem;color:var(--dim);line-height:1.55;margin-bottom:${pills?'8px':'0'}">${ev.desc}</div>
    ${pills?`<div class="req-pills">${pills}</div>`:''}
  </div>`;
}

function groupInfo(mg,ev){
  if(!mg)return'';
  const pool=mg.pool||{},req=getReq(ev,mg.members),hasReq=Object.keys(req).length>0;
  const chips=DK.map(dk=>{
    const have=pool[dk]||0,need=req[dk]||0,cls=!hasReq||!need?'':have>=need?' p-ok':' p-fail';
    return`<div class="pchip${cls}">${DEPTS[dk]?.icon||dk}<span class="pval">${have}</span>${need?`<span style="font-size:.55rem;opacity:.6">/${need}</span>`:''}</div>`;
  }).join('');
  const rows=mg.members.map(m=>{
    const md=DEPTS[m.dept]||{},me=m.id===S.pid;
    return`<div class="mrow${me?' mrow-me':''}${m.alive?'':' mrow-dead'}">
      <span style="display:flex;align-items:center;gap:6px">
        <span class="dbadge" style="background:${md.color}22;color:${md.color};border:1px solid ${md.color}44">${m.dept}</span>
        ${m.name}${me?'<span style="font-size:.7rem;color:var(--amber);margin-left:4px">← ฉัน</span>':''}
      </span>
      <span style="font-family:var(--mono);font-size:.7rem;color:${md.color||'var(--dim)'}">${m.items||0}</span>
    </div>`;
  }).join('');
  return`<div class="card" style="padding:12px 14px">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
      <span style="font-family:var(--deco);font-size:.95rem;letter-spacing:.12em;color:var(--amber)">${mg.name}</span>
      <span style="font-family:var(--mono);font-size:.58rem;color:var(--dim)">${mg.members.filter(m=>S.players[m.id]?.alive).length} alive</span>
    </div>
    <div class="pool-row" style="margin-bottom:10px">${chips}</div>
    <div>${rows}</div>
  </div>`;
}

// expose
window.doLogin=doLogin;window.doLogout=doLogout;window.doJoinGroup=doJoinGroup;
window.doUseItems=doUseItems;window.doDiscardItems=doDiscardItems;
window.stepUse=stepUse;window.stepDiscard=stepDiscard;
window.toggleLog=toggleLog;window.updatePreview=updatePreview;

// init
startListeners();
const saved=loadSession();
if(saved){
  onValue(ref(db,'players/'+saved),snap=>{
    off(ref(db,'players/'+saved));
    if(snap.val()){S.pid=saved;S.player=snap.val();}
    render();
  },{onlyOnce:true});
}else{render();}
</script>
</body>
</html>
