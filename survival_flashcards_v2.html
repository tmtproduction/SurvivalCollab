    {d:'#378ADD',t:'4. ดู <b>พลังชีวิต</b> อย่าให้เป็น 0'},
    {d:'#378ADD',t:'5. จบเกม → ตอบ <b>คำถาม 2 ข้อ</b>'},
   ]},
];

let cur=0,fl=false,fd=[...D];

function render(){
  const c=fd[cur];
  if(!c)return;
  const pct=Math.round((cur+1)/fd.length*100);
  document.getElementById('pf').style.width=pct+'%';
  document.getElementById('pt').textContent=(cur+1)+' / '+fd.length;
  document.getElementById('bp').disabled=cur===0;
  document.getElementById('bn').disabled=cur===fd.length-1;
  document.getElementById('fhint').textContent=fl?'แตะอีกครั้งเพื่อกลับหน้าหลัก':'แตะการ์ดเพื่อดูรายละเอียด';
  document.getElementById('cm').textContent=c.lbl;

  const items=c.items.map(it=>`
    <div class="bitem">
      <div class="bdot" style="background:${it.d}"></div>
      <div>
        <div class="btext">${it.t}</div>
        ${it.tag&&it.tt?`<span class="btag ${it.tag}">${it.tt}</span>`:''}
      </div>
    </div>`).join('');

  const tagHtml=c.tag?`<span class="card-tag ${c.tag.cls}">${c.tag.txt}</span>`:'';

  document.getElementById('carea').innerHTML=`
    <div class="card" onclick="flip()">
      <div class="card-top">
        <div class="card-icon">${c.e}</div>
        <div class="card-meta">
          <div class="card-label">${c.lbl}</div>
          <div class="card-name">${c.name}</div>
          ${tagHtml}
        </div>
      </div>
      <div class="front ${fl?'h':''}">
        <div>
          <div style="font-size:11px;color:var(--color-text-tertiary);margin-bottom:6px">คีย์เวิร์ด</div>
          <div class="kw">${c.kw}</div>
          <div class="kw-sub">${c.kwsub||''}</div>
        </div>
        <div class="tap-hint">แตะเพื่อดูรายละเอียด ↓</div>
      </div>
      <div class="back ${fl?'s':''}">
        ${items}
      </div>
    </div>`;
}

function flip(){fl=!fl;render();}
function go(d){cur=Math.max(0,Math.min(fd.length-1,cur+d));fl=false;render();}
function setCat(cat,el){
  document.querySelectorAll('.cat').forEach(b=>b.classList.remove('on'));
  el.classList.add('on');
  fd=cat==='all'?[...D]:D.filter(x=>x.c===cat);
  cur=0;fl=false;
  document.getElementById('fsub').textContent='แตะการ์ดเพื่อดูเฉลย · '+fd.length+' ใบ';
  render();
}
render();
</script>
